[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moritz-mcp"
version = "0.3.0"
description = "MCP server for Moritz"
requires-python = ">=3.10"
dependencies = [
    "docutils",
    "mcp[cli]>=1.2.0,<2",
    "pyyaml",
]

[project.scripts]
moritz-mcp = "mzmcp:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"mzmcp" = [
    # MCP prompt definitions.
    "data/prompts.yml",
    # Moritz's command list (copied from the add-on when the extension is built).
    "moritz_commands.py",
    # Blender Python API reference.
    "data/api/**/*.rst",
    # Blender user manual.
    "data/manual/**/*.rst",
]

[tool.mypy]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = [
    "mzmcp", "mzmcp.*",
    "moritz_mcp", "moritz_mcp.*",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "bpy", "bpy.*",
    "mcp", "mcp.*",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["mzmcp/data"]

[tool.ruff.lint]
ignore = [
    # Don't suggest f-string.
    # Why disable? Personal preference.
    "UP032",
    # Do not catch blind exception: `Exception`.
    # Why disable? There are times we *need* to be generic.
    "BLE001",
    # Combine `if` statements using `and`.
    # Why disable? Makes the code more dense and difficult to refator (at times).
    "SIM102",
    # Combine `if` branches using logical `or` operator.
    # Why disable? Code may be grouped in ways that make sense conceptually.
    "SIM114",
    # `__slots__` is not sorted.
    # Why disable? Slots are often grouped logically, matching `__init__`, sometimes using groups.
    "RUF023",
]

[tool.pylint.format]
max-line-length = 120

[tool.autopep8]
max_line_length = 120
ignore = [
    "E721",
    "E722",
    "E402",
    "W690",
]
aggressive = 2

